<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauke DanKasuwa Apk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: #00A859;
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            box-shadow: 0 5px 15px rgba(0, 168, 89, 0.3);
        }

        h1 {
            font-size: 24px;
            color: #004d26;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-block;
            background-color: #00A859;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 30px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0, 168, 89, 0.3);
            transition: background 0.3s, transform 0.2s;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-btn:hover {
            background-color: #008f4c;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Alamar App ko Logo dinka -->
        <div class="logo-box">DK</div>
        
        <h1>DanKasuwa App</h1>
        <p>Ka sauke manhajar DanKasuwa a wayarka ta Android domin gudanar da harkokin kasuwancinka cikin sauƙi da aminci.</p>

        <!-- Maɓallin Saukewa (Ka tabbata sunan APK dinka a cikin github da yazo daidai da wannan href) -->
        <a href="dankasuwa.apk" class="download-btn" download>Sauke App Yanzu (APK)</a>

        <div class="footer-note">
            Sigar Farko &bull; Mai aminci kuma ta zamani
        </div>
    </div>

</body>
</html>
